<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bio Page</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome for Social Icons (Optional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Video or Image Container -->
  <div class="bg-overlay"></div>

  <!-- Main Container -->
  <div class="tilt-card-container">
    <div class="tilt-card" id="tiltCard">
      
      <!-- Profile Picture -->
      <img src="https://via.placeholder.com/100" alt="Avatar" class="avatar">
      
      <!-- Username / Title -->
      <h1 class="username">YourName</h1>
      
      <!-- Short Bio -->
      <p class="bio">Digital Creator | Developer | Gamer</p>
      
      <!-- Links Section -->
      <div class="links">
        <a href="https://discord.gg/yourserver" target="_blank" class="link-btn">
          <i class="fa-brands fa-discord"></i> Discord
        </a>
        <a href="https://twitter.com/yourhandle" target="_blank" class="link-btn">
          <i class="fa-brands fa-x-twitter"></i> Twitter / X
        </a>
        <a href="https://github.com/yourusername" target="_blank" class="link-btn">
          <i class="fa-brands fa-github"></i> GitHub
        </a>
        <a href="https://youtube.com/@yourchannel" target="_blank" class="link-btn">
          <i class="fa-brands fa-youtube"></i> YouTube
        </a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
