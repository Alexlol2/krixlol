<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@krix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Scanline Overlay for Texture -->
  <div class="scanlines"></div>

  <!-- Custom Glowing Cursor Dot -->
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Click to Enter Overlay -->
  <div id="enterOverlay" class="overlay">
    <p>[ click anywhere to enter ]</p>
  </div>

  <!-- Minimal Audio Control -->
  <div class="audio-control" id="audioToggle">
    <i class="fa-solid fa-volume-high" id="audioIcon"></i>
  </div>

  <!-- Background Image Layer -->
  <div class="bg-container" id="bgContainer"></div>

  <!-- Background Audio (MP3) -->
  <audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>

  <!-- Canvas for Trail, Particles, and Click Ring Effect -->
  <canvas id="fxCanvas"></canvas>

  <!-- Main Container -->
  <div class="tilt-card-container">
    <div class="tilt-card" id="tiltCard">
      
      <!-- Profile Picture with Glowing Ring Decoration -->
      <div class="avatar-wrapper">
        <div class="glow-ring"></div>
        <img src="pfp.png" alt="Profile Picture" class="avatar">
      </div>
      
      <!-- Username with Typewriter Effect -->
      <h1 class="username" id="typewriter"></h1>
      
      <!-- Bio -->
      <p class="bio">wasap im krix a vtag content creator</p>
      
      <!-- Social Links (YouTube) -->
      <div class="links">
        <a href="https://www.youtube.com/@Krix_VR" target="_blank" class="link-btn youtube-btn">
          <i class="fa-brands fa-youtube"></i> YouTube
        </a>
      </div>

      <!-- Aesthetic Audio Visualizer Bars -->
      <div class="equalizer" id="equalizer">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
