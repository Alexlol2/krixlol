<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@krix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Custom Glowing Cursor Dot -->
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Click to Enter Overlay -->
  <div id="enterOverlay" class="overlay">
    <p>[ click anywhere to enter ]</p>
  </div>

  <!-- Background Image with Blur Effect -->
  <div class="bg-container" id="bgContainer"></div>

  <!-- Background Audio (MP3) -->
  <audio id="bgMusic" src="song.mp3" loop preload="auto"></audio>

  <!-- Canvas for Falling Snowflakes -->
  <canvas id="snowCanvas"></canvas>

  <!-- Main Container -->
  <div class="tilt-card-container">
    <div class="tilt-card" id="tiltCard">
      
      <!-- Profile Picture -->
      <img src="pfp.png" alt="Profile Picture" class="avatar">
      
      <!-- Username -->
      <h1 class="username">krix</h1>
      
      <!-- Bio -->
      <p class="bio">nothing really matters.</p>
      
      <!-- Social Links -->
      <div class="links">
        <a href="https://discord.com" target="_blank" class="link-btn">
          <i class="fa-brands fa-discord"></i> Discord
        </a>
        <a href="https://twitter.com" target="_blank" class="link-btn">
          <i class="fa-brands fa-x-twitter"></i> Twitter
        </a>
        <a href="https://github.com" target="_blank" class="link-btn">
          <i class="fa-brands fa-github"></i> GitHub
        </a>
        <a href="https://spotify.com" target="_blank" class="link-btn">
          <i class="fa-brands fa-spotify"></i> Spotify
        </a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
